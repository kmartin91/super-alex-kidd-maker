[package]
name = "super-alex-kidd-maker"
version = "0.1.0"
description = "Super Alex Kidd Maker"
edition = "2021"

[lib]
name = "super_alex_kidd_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-deep-link = "2.5.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = { version = "2.5.0", features = ["deep-link"] }
tauri-plugin-updater = "2.13.0"
